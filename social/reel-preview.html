<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview reel Eteria Robotics Studio</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070a10;
      color: #dcecff;
      font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif;
    }

    main {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    video {
      width: min(420px, 92vw);
      max-height: 86vh;
      background: #000;
      box-shadow: 0 24px 90px #000a;
    }

    p {
      margin: 0;
      color: #91a3bc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <video src="./eteria-robotics-studio-reel.webm" controls playsinline></video>
    <p id="meta">Cargando metadatos...</p>
  </main>
  <script>
    const video = document.querySelector('video');
    const meta = document.getElementById('meta');
    video.addEventListener('loadedmetadata', () => {
      meta.textContent = `${Math.round(video.duration)}s · ${video.videoWidth}x${video.videoHeight}`;
    });
  </script>
</body>
</html>
