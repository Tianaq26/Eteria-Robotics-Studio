<!doctype html><html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; background:transparent; overflow:hidden;
    font-family:'Segoe UI', system-ui, 'DejaVu Sans', sans-serif; }
  .punch { position:absolute; left:170px; top:620px; width:740px; height:1150px;
    border-radius:26px; border:2px solid #6de7b766;
    box-shadow: 0 0 90px 6px #6de7b740, 0 0 0 4000px #0b0e14; }
  .vig { position:absolute; left:0; top:0; width:1080px; height:560px;
    background: radial-gradient(120% 130% at 50% -30%, #6de7b71f 0%, transparent 62%); }
  .vig2 { position:absolute; left:0; bottom:0; width:1080px; height:130px;
    background: linear-gradient(0deg, #6de7b712 0%, transparent 100%); }
  .head { position:absolute; left:60px; right:60px; top:170px; text-align:center; }
  .kicker { display:inline-block; padding:14px 30px; border:1.5px solid #6de7b799; border-radius:999px;
    color:#6de7b7; font-size:30px; font-weight:700; letter-spacing:7px; }
  h1 { margin-top:44px; color:#f2f5fb; font-size:96px; line-height:1.06; font-weight:800; letter-spacing:-1px; }
  h1 b { color:#6de7b7; }
  .sub { margin-top:30px; color:#aab3c8; font-size:40px; font-weight:500; }
  .dots { position:absolute; left:0; right:0; top:1814px; text-align:center; }
  .dot { display:inline-block; height:10px; border-radius:99px; background:#3a4356; margin:0 7px; vertical-align:middle; }
  .dot.on { background:#6de7b7; box-shadow:0 0 14px #6de7b7; }
  .brand { position:absolute; left:0; right:0; bottom:96px; text-align:center;
    color:#8b94ab; font-size:34px; font-weight:600; letter-spacing:3px; }
  .brand b { color:#e8ecf5; }
</style></head><body>
  <div class="punch"></div>
  <div class="vig"></div><div class="vig2"></div>
  <div class="head">
    <div class="kicker">HAZLO TUYO</div>
    <h1>Pinta y personaliza<br>tu robot</h1>
    <div class="sub">Editor de diseño 3D integrado</div>
  </div>
  <div class="dots"><span style="width:10px" class="dot "></span><span style="width:10px" class="dot "></span><span style="width:10px" class="dot "></span><span style="width:34px" class="dot on"></span></div>
  <div class="brand"><b>ETERIA</b> TECH · ROBOTICS STUDIO</div>
</body></html>
